name: GitarAkordi daily monitor

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-monitor.yml'
      - 'scripts/site-monitor*.cjs'
      - 'scripts/lib/site-monitor*.cjs'
      - 'scripts/test-site-monitor.cjs'
      - 'scripts/test-site-monitor-report.cjs'
      - 'lib/seo/domain.cjs'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/site-monitor.yml'
      - 'scripts/site-monitor*.cjs'
      - 'scripts/lib/site-monitor*.cjs'
      - 'scripts/test-site-monitor.cjs'
      - 'scripts/test-site-monitor-report.cjs'
      - 'lib/seo/domain.cjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: site-monitor-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install monitor dependencies without lifecycle scripts
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify monitor safeguards
        run: node --test scripts/test-site-monitor.cjs scripts/test-site-monitor-report.cjs
      - name: Inspect public production pages
        id: monitor
        if: github.event_name != 'pull_request'
        env:
          MONITOR_SITE_URL: ${{ vars.MONITOR_SITE_URL || 'https://www.gitarakordi.com' }}
        run: node scripts/site-monitor.cjs
      - name: Optional AI advice for scheduled findings
        if: always() && steps.monitor.outcome != 'skipped' && steps.monitor.outcome != '' && github.event_name == 'schedule' && github.run_attempt == 1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/site-monitor-ai.cjs
      - name: Publish validated details for the admin panel
        if: always() && steps.monitor.outcome != 'skipped' && steps.monitor.outcome != '' && github.event_name != 'pull_request'
        run: node scripts/site-monitor-publish.cjs
      - name: Write run summary
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -f reports/site-monitor/summary.md ]; then
            cat reports/site-monitor/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The monitor did not complete. Inspect the failed step; no site content was changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain sanitized reports
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/site-monitor/report.json
            reports/site-monitor/summary.md
          retention-days: 30
          if-no-files-found: warn
